<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>To do</title>
  </head>
  <body>
    <div class="login-image">
      <img src="login.png" />
    </div>
    <div class="login-form">
      <h1
        style="
          font-size: 1.5rem;
          color: #7880dd;
          margin-bottom: 0.2rem;
          margin-top: 0.2rem;
        "
      >
        Sign In
      </h1>
      <p style="margin-top: 0.15rem; margin-bottom: 2rem; color: #7880dd">
        Enter your Details
      </p>
      <input
        type="text"
        name="email"
        minlength="6"
        maxlength="20"
        required,
        placeholder="email"
      /><br /><br />
      <input
        type="text"
        name="full name"
        minlength="6"
        maxlength="20"
        required,
        placeholder="full name"
        style="margin-bottom: 0%"
      /><br /><br />
      <input
        type="text"
        name="password"
        minlength="6"
        maxlength="20"
        required,
        placeholder="password"
        style="margin-bottom: 0%"
      /><br /><br />
      <div class="flex-parent jc-center">
        <input type="button" class="button" value="Submit" />
      </div>
    </div>
  </body>
</html>
